<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Rising sun motif -->
  <circle cx="60" cy="48" r="16" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <circle cx="60" cy="48" r="10" fill="#c9a84c" opacity="0.3"/>
  <!-- Sun rays -->
  <line x1="60" y1="24" x2="60" y2="18" stroke="#c9a84c" stroke-width="2"/>
  <line x1="76" y1="32" x2="80" y2="28" stroke="#c9a84c" stroke-width="1.5"/>
  <line x1="44" y1="32" x2="40" y2="28" stroke="#c9a84c" stroke-width="1.5"/>
  <line x1="82" y1="48" x2="88" y2="48" stroke="#c9a84c" stroke-width="1.5"/>
  <line x1="38" y1="48" x2="32" y2="48" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Horizon line -->
  <line x1="20" y1="65" x2="100" y2="65" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Radiating lines from horizon -->
  <line x1="60" y1="65" x2="25" y2="48" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <line x1="60" y1="65" x2="95" y2="48" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <line x1="60" y1="65" x2="35" y2="42" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <line x1="60" y1="65" x2="85" y2="42" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <!-- TIFA text -->
  <text x="60" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#c9a84c" letter-spacing="4">TIFA</text>
  <!-- Subtitle -->
  <text x="60" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="5.5" fill="#e8e8e8" letter-spacing="1">TOKYO FOTO AWARDS</text>
</svg>