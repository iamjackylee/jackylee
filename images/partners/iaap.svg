  <line x1="32" y1="42" x2="88" y2="42" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  <ellipse cx="60" cy="42" rx="28" ry="10" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
