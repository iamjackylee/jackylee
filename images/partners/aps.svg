  <!-- Subtitle -->
  <text x="60" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e8e8e8" letter-spacing="1.5">AUSTRALIAN</text>
  <text x="60" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e8e8e8" letter-spacing="1.5">PHOTOGRAPHIC</text>
